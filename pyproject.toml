[project]
name = "trainpiro"
version = "0.1.0"
description = "Piro — open source model development framework, built on PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Vargas", email = "hello@vargasjr.dev" },
]
keywords = ["pytorch", "machine-learning", "model-training", "rl", "piro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8.0",
]
dev = [
    "trainpiro[plot]",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "pytest>=8.0.0",
]

[project.scripts]
piro = "piro.cli:main"

[project.urls]
Homepage = "https://trainpiro.app"
Repository = "https://github.com/vargasjr-dev/piro"
Documentation = "https://github.com/vargasjr-dev/piro#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piro", "model"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
