[project]
name = "piro-research"
version = "0.1.0"
description = "Piro's model architectures, training sources, benchmarks, and Modal platform runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vargas", email = "hello@vargasjr.dev" },
]
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8.0"]
modal = ["modal>=0.63.0"]
dev = [
    "piro-research[plot,modal]",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["architectures", "benchmarks", "sources"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = ["platform/modal/**/*.py", "**/test_*.py"]
