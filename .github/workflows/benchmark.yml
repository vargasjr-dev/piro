name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite_run_id:
        description: "Suite run ID (from benchmark_suite_run table)"
        required: false
        default: ""
      benchmarks:
        description: "Comma-separated benchmark names to run (blank = all)"
        required: false
        default: ""
      models:
        description: "Comma-separated model targets to run (blank = all)"
        required: false
        default: ""

jobs:
  benchmark:
    name: Run benchmarks and post results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install model dependencies
        working-directory: model
        run: uv sync --extra scoring

      - name: Run benchmarks
        working-directory: ${{ github.workspace }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIRO_POST_URL: ${{ secrets.PIRO_POST_URL }}
          PIRO_POST_KEY: ${{ secrets.PIRO_POST_KEY }}
        run: |
          ARGS=""
          # Suite run ID (links results back to benchmark_suite_run row)
          if [ -n "${{ github.event.inputs.suite_run_id }}" ]; then
            ARGS="$ARGS --suite-run-id ${{ github.event.inputs.suite_run_id }}"
          fi
          # Benchmark filter (comma-separated → multiple --benchmark flags)
          if [ -n "${{ github.event.inputs.benchmarks }}" ]; then
            IFS=',' read -ra BENCHES <<< "${{ github.event.inputs.benchmarks }}"
            for b in "${BENCHES[@]}"; do
              ARGS="$ARGS --benchmark ${b// /}"
            done
          fi
          # Model filter (comma-separated → multiple --model flags)
          if [ -n "${{ github.event.inputs.models }}" ]; then
            IFS=',' read -ra MODELS <<< "${{ github.event.inputs.models }}"
            for m in "${MODELS[@]}"; do
              ARGS="$ARGS --model ${m// /}"
            done
          fi
          uv run python model/run_benchmarks.py \
            --post-url "$PIRO_POST_URL" \
            --post-key "$PIRO_POST_KEY" \
            $ARGS
