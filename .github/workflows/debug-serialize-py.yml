name: Debug Serialize Python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-serialize-py.yml"
      - "scripts/debug_serialize.py"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install torch pydantic boto3 fastapi --quiet

      - name: Run serialize locally
        run: python3 scripts/debug_serialize.py
