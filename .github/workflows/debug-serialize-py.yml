name: Debug Serialize Python

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install torch pydantic boto3 fastapi --quiet

      - name: Run serialize locally
        run: |
          python3 - <<'PYEOF'
import sys, importlib.util, tempfile, os, traceback
sys.path.insert(0, ".")

for slug in ["scratch/ctm_model.py", "scratch/baseline_transformer_model.py"]:
    print(f"\n{'='*60}\n{slug}\n{'='*60}")
    model_source = open(slug).read()

    with tempfile.NamedTemporaryFile(suffix=".py", delete=False, mode="w") as f:
        f.write(model_source)
        tmp_path = f.name

    try:
        spec = importlib.util.spec_from_file_location("_piro_user_model", tmp_path)
        module = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(module)
    except Exception:
        print("EXEC ERROR:")
        traceback.print_exc()
        os.unlink(tmp_path)
        continue
    finally:
        try: os.unlink(tmp_path)
        except: pass

    from piro import PiroModel
    model_cls = None
    for attr_name in dir(module):
        obj = getattr(module, attr_name, None)
        if obj and isinstance(obj, type) and issubclass(obj, PiroModel) and obj is not PiroModel:
            model_cls = obj
            break

    if not model_cls:
        print("ERROR: no PiroModel subclass found")
        continue

    print(f"Found: {model_cls}")
    print(f"hyper_parameters: {model_cls.hyper_parameters}")

    try:
        result = model_cls.serialize()
        print(f"OK: parameterCount={result.parameterCount}")
        print(f"graph nodes: {len(result.graph.nodes) if result.graph else 0}")
    except Exception:
        print("SERIALIZE ERROR:")
        traceback.print_exc()
PYEOF
