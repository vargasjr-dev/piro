name: Debug Serialize

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Call serialize endpoint
        run: |
          CTM_ID="ec7a5ec1-aaf0-4748-a6f7-f1178d61a323"
          RESULT=$(curl -s -w "\n---HTTP %{http_code}---" \
            "https://dvargasfuertes--piro-serialize.modal.run?class_id=${CTM_ID}&bust=true" \
            -H "X-Piro-Secret: ${{ secrets.MODAL_WEBHOOK_SECRET }}")
          echo "$RESULT"
