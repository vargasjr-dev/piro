name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

  schema-check:
    name: Schema Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify schema has no ungenerated migration
        run: |
          before=$(git status --porcelain)
          bunx drizzle-kit generate --config drizzle.config.ts --name ci-schema-check
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "❌ data/schema.ts has changes that are not represented by a committed Drizzle migration."
            echo "Run 'bun run db:generate', review the generated files, and commit them with the schema change."
            git status --short
            exit 1
          fi
          echo "✅ Schema and committed Drizzle migrations are in sync"
