name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Type check
        run: bunx tsc --noEmit

  schema-check:
    name: Schema Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check for schema changes
        run: |
          if ! diff -q data/schema.ts base/data/schema.ts > /dev/null 2>&1; then
            echo "⚠️ data/schema.ts has been modified in this PR"
            echo ""
            echo "Changes:"
            diff data/schema.ts base/data/schema.ts || true
            echo ""
            echo "If this is an additive change (new table, new nullable column),"
            echo "db-migrate.yml will push it automatically on merge."
            echo ""
            echo "For destructive changes (drops, renames, type changes),"
            echo "ensure production data is migrated before merging."
          else
            echo "✅ No schema changes detected"
          fi
