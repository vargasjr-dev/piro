name: Modal Deploy

on:
  push:
    branches: [main]
    paths:
      - "architectures/**"
      - "benchmarks/**"
      - "sources/**"
      - "platform/**"
      - "pyproject.toml"
      - ".github/workflows/modal-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install modal
        run: uv tool install modal

      - name: Deploy
        run: |
          modal deploy platform/modal/training.py
          modal deploy platform/modal/inference.py
          modal deploy platform/modal/source.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
