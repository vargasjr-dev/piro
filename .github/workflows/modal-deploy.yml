name: Modal Deploy

on:
  push:
    branches: [main]
    paths:
      - "architectures/**"
      - "sources/**"
      - "platform/modal/**"
      - "pyproject.toml"
      - ".github/workflows/modal-deploy.yml"
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed Modal apps
    runs-on: ubuntu-latest
    outputs:
      training: ${{ steps.filter.outputs.training }}
      inference: ${{ steps.filter.outputs.inference }}
      source: ${{ steps.filter.outputs.source }}
      gemma: ${{ steps.filter.outputs.gemma }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            training:
              - 'platform/modal/training.py'
              - 'platform/modal/_common.py'
              - 'architectures/**'
              - 'sources/**'
              - 'pyproject.toml'
              - '.github/workflows/modal-deploy.yml'
            inference:
              - 'platform/modal/inference.py'
              - 'platform/modal/_common.py'
              - 'architectures/**'
              - 'pyproject.toml'
              - '.github/workflows/modal-deploy.yml'
            source:
              - 'platform/modal/source.py'
              - 'platform/modal/_common.py'
              - 'sources/**'
              - 'pyproject.toml'
              - '.github/workflows/modal-deploy.yml'
            gemma:
              - 'platform/modal/gemma.py'
              - 'platform/modal/_common.py'
              - 'pyproject.toml'
              - '.github/workflows/modal-deploy.yml'

  sync-secrets:
    name: Sync Modal runtime secrets
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODAL_WEBHOOK_SECRET: ${{ secrets.MODAL_WEBHOOK_SECRET }}
          BUCKET_ENDPOINT_URL: ${{ secrets.BUCKET_ENDPOINT_URL }}
          BUCKET_KEY_ID: ${{ secrets.BUCKET_KEY_ID }}
          BUCKET_APPLICATION_SECRET: ${{ secrets.BUCKET_APPLICATION_SECRET }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL MODAL_WEBHOOK_SECRET BUCKET_ENDPOINT_URL BUCKET_KEY_ID BUCKET_APPLICATION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret $name is not configured." >&2
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - name: Create or update Modal runtime secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODAL_WEBHOOK_SECRET: ${{ secrets.MODAL_WEBHOOK_SECRET }}
          BUCKET_ENDPOINT_URL: ${{ secrets.BUCKET_ENDPOINT_URL }}
          BUCKET_KEY_ID: ${{ secrets.BUCKET_KEY_ID }}
          BUCKET_APPLICATION_SECRET: ${{ secrets.BUCKET_APPLICATION_SECRET }}
        run: |
          set -euo pipefail
          modal secret create piro-secrets \
            DATABASE_URL="$DATABASE_URL" \
            MODAL_WEBHOOK_SECRET="$MODAL_WEBHOOK_SECRET" \
            BUCKET_ENDPOINT_URL="$BUCKET_ENDPOINT_URL" \
            BUCKET_KEY_ID="$BUCKET_KEY_ID" \
            BUCKET_APPLICATION_SECRET="$BUCKET_APPLICATION_SECRET" \
            --force

  deploy-training:
    name: Deploy training app
    needs: [changes, sync-secrets]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - name: Deploy training app with timestamped output
        id: deploy
        run: |
          set -o pipefail
          modal deploy platform/modal/training.py --timestamps 2>&1 | tee training-deploy.log
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Collect training diagnostics
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set +e
          modal app logs piro-training \
            --tail 2000 \
            --since 2h \
            --timestamps \
            --show-container-id \
            --show-function-id \
            > training-app.log 2>&1
          modal app history piro-training --json > training-history.json 2>&1
          set -e
      - name: Upload training diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borealis-training-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            training-deploy.log
            training-app.log
            training-history.json

  deploy-inference:
    name: Deploy inference app
    needs: [changes, sync-secrets]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - run: modal deploy platform/modal/inference.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  deploy-source:
    name: Deploy source app
    needs: [changes, sync-secrets]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - run: modal deploy platform/modal/source.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  deploy-gemma:
    name: Deploy Gemma app
    needs: [changes, sync-secrets]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.gemma == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - name: Deploy Gemma with timestamped output
        id: deploy
        run: |
          set -o pipefail
          modal deploy platform/modal/gemma.py --timestamps 2>&1 | tee gemma-deploy.log
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Smoke-test Gemma readiness
        if: steps.deploy.outcome == 'success'
        env:
          GEMMA_ENDPOINT: https://dvargasfuertes--piro-gemma-vllm-server.us-east.modal.direct/v1/models
        run: |
          set -euo pipefail
          : > gemma-health.json
          : > gemma-health.headers
          : > gemma-readiness.log
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 10 \
              --dump-header gemma-health.headers \
              --output gemma-health.json \
              --write-out '%{http_code}' \
              "$GEMMA_ENDPOINT" || true)"
            echo "Gemma readiness attempt ${attempt}/30: HTTP ${status}" | tee -a gemma-readiness.log
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Gemma did not become ready within 10 minutes." >&2
          exit 1
      - name: Smoke-test Gemma generation
        if: steps.deploy.outcome == 'success'
        env:
          GEMMA_ENDPOINT: https://dvargasfuertes--piro-gemma-vllm-server.us-east.modal.direct/v1/chat/completions
        run: |
          set -euo pipefail
          payload='{"model":"google/gemma-3-270m","messages":[{"role":"user","content":"Say hello in one short sentence."}],"temperature":0,"max_tokens":1}'
          status="$(curl --silent --show-error --max-time 120 \
            --dump-header gemma-generation.headers \
            --output gemma-generation.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$GEMMA_ENDPOINT")"
          echo "Gemma generation smoke test: HTTP ${status}"
          cat gemma-generation.json
          test "$status" = "200"
      - name: Collect Gemma diagnostics
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set +e
          modal app logs piro-gemma-vllm \
            --tail 2000 \
            --since 2h \
            --timestamps \
            --show-container-id \
            --show-function-id \
            > gemma-app.log 2>&1
          modal app history piro-gemma-vllm --json > gemma-history.json 2>&1
          set -e
      - name: Upload Gemma diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-deployment-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            gemma-deploy.log
            gemma-health.headers
            gemma-health.json
            gemma-readiness.log
            gemma-generation.headers
            gemma-generation.json
            gemma-app.log
            gemma-history.json
