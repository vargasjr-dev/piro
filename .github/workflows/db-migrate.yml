name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "data/schema.ts"
      - "drizzle/**"
      - "drizzle.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch: # allow manual triggers

jobs:
  migrate:
    name: Apply Drizzle migrations to Neon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate pending migrations
        run: bunx drizzle-kit generate --config drizzle.config.ts --name gha-schema-migration

      - name: Apply migrations
        run: bunx drizzle-kit migrate --config drizzle.config.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
