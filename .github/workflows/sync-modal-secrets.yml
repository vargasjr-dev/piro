name: Sync Modal Secrets

# Run manually once after adding new secrets to Vercel that Modal also needs.
# Idempotent: safe to re-run; `modal secret create --force` overwrites in place.

on:
  workflow_dispatch:
    inputs:
      database_url:
        description: "DATABASE_URL"
        required: true
        type: string
      modal_webhook_secret:
        description: "MODAL_WEBHOOK_SECRET"
        required: true
        type: string
      bucket_endpoint_url:
        description: "BUCKET_ENDPOINT_URL"
        required: true
        type: string
      bucket_key_id:
        description: "BUCKET_KEY_ID"
        required: true
        type: string
      bucket_application_secret:
        description: "BUCKET_APPLICATION_SECRET"
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mask all inputs
        run: |
          echo "::add-mask::${{ inputs.database_url }}"
          echo "::add-mask::${{ inputs.modal_webhook_secret }}"
          echo "::add-mask::${{ inputs.bucket_endpoint_url }}"
          echo "::add-mask::${{ inputs.bucket_key_id }}"
          echo "::add-mask::${{ inputs.bucket_application_secret }}"

      - name: Install uv + modal
        uses: astral-sh/setup-uv@v5

      - name: Install modal
        run: uv tool install modal

      - name: Create / update piro-secrets
        run: >-
          modal secret create piro-secrets
          DATABASE_URL="$DATABASE_URL"
          MODAL_WEBHOOK_SECRET="$MODAL_WEBHOOK_SECRET"
          BUCKET_ENDPOINT_URL="$BUCKET_ENDPOINT_URL"
          BUCKET_KEY_ID="$BUCKET_KEY_ID"
          BUCKET_APPLICATION_SECRET="$BUCKET_APPLICATION_SECRET"
          --force
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DATABASE_URL: ${{ inputs.database_url }}
          MODAL_WEBHOOK_SECRET: ${{ inputs.modal_webhook_secret }}
          BUCKET_ENDPOINT_URL: ${{ inputs.bucket_endpoint_url }}
          BUCKET_KEY_ID: ${{ inputs.bucket_key_id }}
          BUCKET_APPLICATION_SECRET: ${{ inputs.bucket_application_secret }}
