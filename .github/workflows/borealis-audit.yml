name: Borealis Checkpoint Audit

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Published Borealis model ID"
        required: true
        type: string
        default: "bea4d410-42a6-4be9-83af-407f67bcb119"

jobs:
  audit:
    name: Inspect published checkpoint logits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install modal
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUCKET_ENDPOINT_URL: ${{ secrets.BUCKET_ENDPOINT_URL }}
          BUCKET_KEY_ID: ${{ secrets.BUCKET_KEY_ID }}
          BUCKET_APPLICATION_SECRET: ${{ secrets.BUCKET_APPLICATION_SECRET }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL BUCKET_ENDPOINT_URL BUCKET_KEY_ID BUCKET_APPLICATION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret $name is not configured." >&2
              exit 1
            fi
          done
      - name: Run direct checkpoint audit
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -o pipefail
          MODEL_ID="$MODEL_ID" modal run platform/modal/borealis_audit.py | tee borealis-audit.json
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: borealis-checkpoint-audit-${{ github.run_id }}
          retention-days: 3
          path: borealis-audit.json
