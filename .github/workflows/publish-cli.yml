name: Publish CLI

# Publishes the `trainpiro` npm package whenever cli/package.json is updated on
# main with a version that doesn't yet exist on the registry.
#
# Auth strategy: npm OIDC trusted publishing (no long-lived token stored).
#
# One-time setup required on npmjs.com (after the initial publish claims the
# package name):
#   npmjs.com → Packages → trainpiro → Settings → Trusted Publisher → GitHub Actions
#     Owner:    vargasjr-dev
#     Repo:     piro
#     Workflow: publish-cli.yml
#
# Initial publish bootstrap:
#   The very first publish must use NPM_TOKEN (chicken-and-egg: the package
#   must exist before trusted publishing can be configured on npm).
#   Once the package exists and trusted publishing is configured, remove
#   NPM_TOKEN from GitHub secrets — all future publishes will use OIDC.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1.
      # The version bundled with Node 20 on GHA runners is older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check if version is already published
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view trainpiro@"$PKG_VERSION" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION not yet published — will publish."
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish --access public
        # NODE_AUTH_TOKEN is only needed for the very first publish (before
        # trusted publishing is configured on npmjs.com). Once OIDC is set up,
        # remove NPM_TOKEN from GitHub secrets and this env block becomes a no-op.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
