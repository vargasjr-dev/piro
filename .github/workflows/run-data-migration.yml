name: Run PR Data Operation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR containing the migration script"
        required: true
        type: string
      script:
        description: "One-time script path under scripts/data-migrations/"
        required: true
        type: string
      credentials:
        description: "Credential set exposed to the script"
        required: true
        type: choice
        options:
          - database
          - bucket
        default: database
      apply:
        description: "Allow a script that supports it to perform writes (otherwise dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-data-migration
  cancel-in-progress: false

jobs:
  run:
    name: Run PR data operation
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - name: Resolve and validate pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MIGRATION_SCRIPT: ${{ inputs.script }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed('pr_number must be a positive integer');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const expectedRepository = `${owner}/${repo}`;

            if (pull.state !== 'open') {
              core.setFailed(`PR #${pullNumber} must be open; it is ${pull.state}`);
              return;
            }
            if (pull.base.ref !== 'main') {
              core.setFailed(`PR #${pullNumber} must target main; it targets ${pull.base.ref}`);
              return;
            }
            if (!pull.head.repo || pull.head.repo.full_name !== expectedRepository) {
              core.setFailed('The migration PR must come from this repository, not a fork');
              return;
            }

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber },
            );
            const requestedScript = process.env.MIGRATION_SCRIPT;
            const allowedSupportingFiles = new Set([
              '.github/workflows/run-data-migration.yml',
              'scripts/data-migrations/README.md',
            ]);
            const selectedScript = changedFiles.find(
              (file) => file.filename === requestedScript && file.status === 'added',
            );
            const unexpectedFiles = changedFiles.filter(
              (file) => file.filename !== requestedScript && !allowedSupportingFiles.has(file.filename),
            );
            if (!selectedScript || unexpectedFiles.length > 0) {
              core.setFailed(
                `The PR must add the selected script and may only modify the approved runner documentation; received ${changedFiles.map((file) => `${file.status}:${file.filename}`).join(', ') || 'no files'}`,
              );
              return;
            }

            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('head_repository', pull.head.repo.full_name);
            core.info(`Using ${expectedRepository}@${pull.head.sha} from PR #${pullNumber}`);

      - name: Check out PR revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate migration script path
        env:
          MIGRATION_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          case "$MIGRATION_SCRIPT" in
            scripts/data-migrations/*.ts|scripts/data-migrations/*.js) ;;
            *)
              echo "script must be a .ts or .js file directly under scripts/data-migrations/." >&2
              exit 1
              ;;
          esac
          case "$MIGRATION_SCRIPT" in
            *..*|scripts/data-migrations/*/*)
              echo "script must not contain traversal or nested directories." >&2
              exit 1
              ;;
          esac
          if [ ! -f "$MIGRATION_SCRIPT" ]; then
            echo "Migration script does not exist in the selected PR: $MIGRATION_SCRIPT" >&2
            exit 1
          fi
          echo "Migration script: $MIGRATION_SCRIPT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database operation
        if: inputs.credentials == 'database'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in the production-migrations environment." >&2
            exit 1
          fi
          bun "$MIGRATION_SCRIPT"

      - name: Run bucket operation
        if: inputs.credentials == 'bucket'
        env:
          BUCKET_ENDPOINT_URL: ${{ secrets.BUCKET_ENDPOINT_URL }}
          BUCKET_KEY_ID: ${{ secrets.BUCKET_KEY_ID }}
          BUCKET_APPLICATION_SECRET: ${{ secrets.BUCKET_APPLICATION_SECRET }}
          B2_CLEANUP_CONFIRM: ${{ inputs.apply && 'DELETE_SUPERSEDED_CHECKPOINT_VERSIONS' || '' }}
          MIGRATION_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          for name in BUCKET_ENDPOINT_URL BUCKET_KEY_ID BUCKET_APPLICATION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured in the production-migrations environment." >&2
              exit 1
            fi
          done
          bun "$MIGRATION_SCRIPT"
