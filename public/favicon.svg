  <!-- Inner glow / hot core — wraps the letter -->
  <path d="M50 46
    C42 54, 36 62, 38 72
    C40 82, 46 92, 50 92
    C54 92, 60 82, 62 72
    C64 62, 58 54, 50 46Z"
    fill="url(#fg-inner)" opacity="0.85"/>
  <!-- P letterform -->
  <text x="50" y="90" text-anchor="middle"
    font-family="system-ui,-apple-system,sans-serif"
    font-weight="900" font-size="26" fill="white" opacity="0.95">P</text>
</svg>
