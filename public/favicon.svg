<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <linearGradient id="fg-outer" x1="50" y1="100" x2="50" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="fg-inner" x1="50" y1="96" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <!-- Outer flame — wide at base, pointed tip, organic curves -->
  <path d="M50 8
    C42 16, 22 24, 18 44
    C14 58, 18 66, 14 76
    C10 88, 22 102, 50 102
    C78 102, 90 88, 86 76
    C82 66, 86 58, 82 44
    C78 24, 58 16, 50 8Z"
